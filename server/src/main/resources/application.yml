spring:
  application:
    name: kanban
  lifecycle:
    # Upper bound on graceful shutdown. Must stay comfortably BELOW the kill grace in
    # scripts/env.sh (BACKEND_KILL_GRACE, 60s) so the JVM always wins the race and the
    # script never has to resort to SIGKILL.
    timeout-per-shutdown-phase: 45s
  task:
    scheduling:
      pool:
        # One thread per @Scheduled poller. There are exactly two — the board's task
        # worker (ClaudeWorkerService.poll) and the workflow runner
        # (WorkflowRunnerService.poll) — and Boot's default pool size of 1 put both on
        # the same thread. Because a tick blocks inside Process.waitFor for the whole
        # Claude session (up to worker.timeout-seconds), whichever poller went first
        # locked the other out for the entire run: a 9-minute board task froze every
        # workflow for 9 minutes, and vice versa. Measured on this box, 42% of workflow
        # wall-clock was spent waiting for the thread (62% on the worst run) — see
        # docs/workflow-parallel-workers.md for the numbers.
        #
        # This raises nobody's concurrency on its own: the board still takes
        # worker.batch-size (1) task per tick, and the runner still advances one node at
        # a time per run. It only stops the two pollers from queueing behind each other.
        # How many workflow runs go at once is workflow.max-concurrent-executions below;
        # a Claude session is ~270 MB, so keep an eye on free memory.
        size: 2
  datasource:
    # File-based H2 so todos survive restarts.
    #
    # The path MUST be absolute. A relative path like ./data/kanban resolves
    # against the process working directory, which differs by launcher:
    #   - `java -jar` from the repo root  -> <repo>/data/kanban.mv.db
    #   - `mvnw spring-boot:run` from backend/ -> <repo>/backend/data/kanban.mv.db
    # That mismatch made the app silently open two different DB files depending
    # on how it was started, so the board appeared to "revert" after a restart
    # (bug: "my db is not correct again"). KANBAN_DATA_DIR (exported absolute by
    # scripts/env.sh) pins the location; the fallback is absolute too so an
    # ad-hoc launch from any directory still finds the same file.
    # To reset, delete <KANBAN_DATA_DIR>/kanban.mv.db.
    url: jdbc:h2:file:${KANBAN_DATA_DIR:${user.home}/Dashboard/data}/kanban;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      # Task attachments are images; keep the request cap in step with
      # attachments.max-bytes below (a little headroom for the multipart frame).
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  # Graceful shutdown: on SIGTERM, stop accepting new requests and let in-flight
  # ones finish instead of dropping the JVM mid-write. Paired with the worker's
  # @PreDestroy session abort and the 60s kill grace in scripts/env.sh, this keeps
  # restarts on the clean-shutdown path. It matters more than it looks: H2 compacts
  # and TRUNCATES kanban.mv.db during its shutdown, so a SIGKILL landing in that
  # window leaves a file whose newest chunks were never flushed — unrecoverable,
  # by any rollback point (that is exactly how the DB was lost on 2026-08-29).
  shutdown: graceful
  # Compress JSON on the way out. The board polls three endpoints every four
  # seconds and the workflow page polls its run list; those bodies are almost
  # entirely prose the agent wrote, which is the most compressible thing there
  # is (measured 8-10x on this data). Uncompressed, an open board moved ~180 MB
  # an hour, and on a phone a 100 KB body is long enough that a cellular
  # handover cuts it mid-transfer — which arrives in the browser as a bare
  # "Failed to fetch" and in this log as "Connection reset by peer".
  #
  # This is invisible to a worker: compression only happens when the client asks
  # with Accept-Encoding, and the worker's java.net.http client never sends that
  # header (see AgentClient), so /api/agent responses go out as plain JSON
  # exactly as before. No protocol change, no worker rebuild.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    # Nominally the floor below which compressing costs more than it saves. Note
    # it does NOT bind here in practice: Tomcat can only apply it when it knows
    # the length up front, and these responses go out chunked, so a small one is
    # compressed anyway — measured, /api/worker/status is 136 bytes plain and 137
    # gzipped. A byte on the smallest endpoint is not worth chasing; the setting
    # stays because it does bind for any response that carries a Content-Length.
    min-response-size: 1024

# --- Task attachments (images a user adds as input for the agent) ---
# Files live next to the live H2 database so one data directory holds all user
# state; only their metadata is stored in the database. The worker hands the
# agent the absolute path of each file, so the session can open the image.
attachments:
  dir: ${KANBAN_DATA_DIR:${user.home}/Dashboard/data}/attachments
  max-bytes: 10485760

# --- Public static-page uploads (task #470) ---
# POST /api/pages accepts a self-contained HTML file WITHOUT any credential and
# publishes it at /p/<slug>.html. Nobody signs in, so these caps are the only
# abuse control: keep them conservative. Set max-uploads-per-hour to 0 to turn
# publishing off entirely (the GET endpoints keep working).
pages:
  max-bytes: 5242880
  max-pages: 200
  max-uploads-per-hour: 30

# --- The agent API remote workers call (/api/agent/**) ---
# A worker claims a unit of work here, heartbeats to keep it and to stream its live log, and
# reports the raw facts of what its session produced. The server decides what those facts mean
# (see TaskOutcomeService) — a worker jar on someone else's laptop is the one part of this
# system a deploy cannot update, so it is never allowed to hold an opinion about a result.
#
# SECURITY: these endpoints are exempt from the site password, exactly as /api/public/ is, and
# on a public domain the token below is the only thing in front of them. It is deliberately
# EMPTY here: with no token the whole API answers 503 and hands out nothing, which is the right
# failure for a missing credential. Supply it from the environment
# (KANBAN_WORKER_TOKEN in scripts/env.sh), never from a file that gets committed.
agent:
  token: ""
  # How long a claim survives without a heartbeat before LeaseReaper takes the work back.
  # Comfortably longer than the worker's heartbeat interval: a laptop lid or a flaky
  # connection should cost a couple of missed beats, not a session that was still running.
  lease-seconds: 120
  # A task about improving this project needs the repo checked out, so it is only offered to a
  # worker declaring repo:<this name>. Everything else runs anywhere.
  repo-name: Dashboard
  reap-interval-ms: 15000
  reap-initial-delay-ms: 20000

# --- Copilot CLI worker ---
worker:
  enabled: true
  # Path to the Copilot CLI. Use an absolute path if it isn't on the service PATH.
  claude-command: copilot
  # Args before the prompt. --output-format json makes the session emit events as they
  # happen, which feed the live per-todo log. To let the session edit files / run
  # commands unattended, --allow-all-tools is included (only in a trusted sandbox).
  extra-args:
    - "--output-format"
    - "json"
    - "--allow-all-tools"
  # The directory each Copilot session runs in — point this at a repo or sandbox.
  working-directory: ${user.home}/kanban-work
  # Per-task hard timeout. Autonomous/agentic tasks (research, multi-file edits,
  # anything that browses or runs many tools) can take tens of minutes — 30 min
  # is a safer default than a few minutes. Raise it for very long jobs.
  timeout-seconds: 1800
  # How long a session may wait, AFTER its last turn, for background work it started —
  # a dynamic workflow (what the ultracode effort level exists to run), a background
  # sub-session — before the CLI gives up and kills that work. Passed through as
  # COPILOT_TASK_WAIT_TIMEOUT_SECONDS; 0 means don't wait at all (Copilot CLI's own
  # sentinel is the opposite of Claude Code's old CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS,
  # where 0 meant wait indefinitely).
  #
  # The CLI's own default is 600s, and it is set here because that default is both far
  # shorter than timeout-seconds above and silent when it fires. A step that hands its
  # work to a dynamic workflow ends its turn with "I'll report back when it's done"; the
  # CLI waits, kills the workflow, and then reports that same stand-in sentence as the
  # step's answer. Nothing marks it: the step is recorded as SUCCEEDED, its cost is
  # real, and the sentence is what every step downstream is handed instead of the work.
  #
  # Waiting is the fix and waiting works — when the background work lands inside the
  # ceiling the CLI gives the session a fresh turn, and the answer written in that turn
  # is the one reported. So the ceiling should be "as long as this session may live".
  #
  # Kept a little UNDER timeout-seconds rather than equal to it: the two clocks start at
  # different moments (this one at the end of the last turn, the timeout at process
  # start), and the slack is what lets the CLI wind up and report cost, duration and a
  # reason instead of being force-killed with none of them.
  #
  # LEFT UNSET ON PURPOSE — that "a little under timeout-seconds" is a relationship, and
  # this file is not where it can be kept. It was written here as 1500 against the 1800
  # above, and then scripts/env.sh launched the backend with
  # --worker.timeout-seconds=3600: the live system gave a session an hour to live and
  # killed the dynamic workflow it started after 25 minutes, leaving 35 minutes of its
  # own allowance unspent. Unset, the wait is derived as timeout-seconds minus 300s
  # headroom, from whatever timeout is actually in force — command line included.
  #
  # Set it only to depart from that: a number pins the wait regardless of the timeout —
  # 0 pinned here means "don't wait at all" rather than "derive" — and a negative value
  # means "derive", same as unset.
  # background-wait-seconds:
  batch-size: 1
  poll-interval-ms: 15000
  initial-delay-ms: 10000

# --- Workflow runner (a DAG of prompt tasks) ---
# The tick dispatches rather than runs: each eligible execution gets a lane of the
# runner's own pool and the scheduler thread returns immediately, so a nine-minute node
# no longer blocks anything. This and the worker above also get a scheduler thread each
# (spring.task.scheduling.pool.size above), so neither waits on the other. A node
# inherits worker.timeout-seconds (except at the ultracode effort level — see
# ultracode-timeout-multiplier below); it runs in a scratch directory of its OWN under
# java.io.tmpdir (<tmp>/kanban-workflow/run-<run>/node-<step>), not
# worker.working-directory, and node-fence-reads below keeps it there.
workflow:
  poll-interval-ms: 5000
  initial-delay-ms: 12000
  # How many runs may have a node in flight at once — this is what lets two executions
  # of the same workflow, or of different workflows, progress at the same time instead
  # of queueing behind each other.
  #
  # It is a cap on RUNS, not on nodes: one execution still occupies exactly one lane and
  # advances one node at a time, even where its graph has independent branches. That is
  # deliberate — it is what makes "exactly one thread touches a run's rows" true, so no
  # two lanes can claim the same node and pay for the same session twice.
  #
  # The ceiling is memory, not CPU: peak Claude processes on this machine is this
  # number + one board task + AiStoryClassifier's pool (2). Measured PSS of a node's
  # session is ~180-210 MB (the ~270 MB in docs/workflow-parallel-workers.md was an
  # earlier reading), so the two lanes this replaces cost ~0.4 GB and four cost ~0.8 GB.
  # At the time of the raise MemAvailable was 1.3 GB with both old lanes already busy,
  # which leaves roughly 0.9 GB of headroom at the new cap. There is NO SWAP on this
  # box, so an over-commit is an OOM kill of the backend, not a slowdown: check
  # `free -m` before raising it further. Note that ~0.9 GB of what is resident today is
  # leaked headless-Chrome from earlier verification scaffolding, not the workers.
  #
  # 1 restores the old strictly-serial behaviour. Lowered back to 2 from 4 to keep the
  # memory ceiling above comfortable — the paragraph above describes the earlier raise.
  max-concurrent-executions: 2
  # How much longer than worker.timeout-seconds a step at the ULTRACODE effort level may
  # live. Every other level spends its whole allowance inside one session's turns, so one
  # timeout fits all of them — a step at max is a step at low done more carefully. An
  # ultracode step is not that shape: it hands its real work to sub-sessions and waits,
  # so its wall clock is the nested work's plus its own, and each of those sub-sessions
  # is a job the size of an ordinary step. Against a single step's ceiling it gets killed
  # holding nothing, having been billed for everything the sub-sessions did first.
  #
  # A multiplier, not a number of seconds, because scripts/env.sh launches the backend
  # with --worker.timeout-seconds=3600 and overrides the 1800 above: an absolute figure
  # would be right in one of those worlds and wrong in the other, and could end up
  # SHORTER than an ordinary step's timeout. The DERIVED background wait scales with it
  # (a pinned worker.background-wait-seconds still wins) — half of this change would be a
  # step alive for three hours whose sub-sessions are killed at fifty-five minutes, and
  # that does not fail, it reports the promise the step wrote before the kill.
  #
  # 1 turns it off; below 1 is clamped to 1. Raising it is not free: a step holds its
  # lane for as long as it runs, and there are only max-concurrent-executions of those,
  # so a long ultracode step at 2 lanes leaves one lane for everything else.
  ultracode-timeout-multiplier: 3
  # --- What a step can SEE (every node, entry included) ---
  # Each step already runs in a scratch directory of its own, which is still what gives
  # it its own place to write to and keeps one step's output from landing in another's.
  #
  # Under Claude Code this property also made that directory an enforced read fence:
  # passing permissions.blockReadsOutsideWorkingDirectories to the CLI refused file-tool
  # reads (Read, Grep, Glob, LSP) — and Bash reads — outside the session's working
  # directory, in EVERY permission mode, including bypassPermissions.
  #
  # COPILOT CLI HAS NO EQUIVALENT ONE-FLAG READ FENCE — it has no --settings flag at
  # all, and its own sandboxing subsystem is a structurally different, more involved
  # feature, not a drop-in replacement (see NodeSessionPlanner#FENCE_KEY). So this
  # property is now a no-op kept only for backward compatibility with existing config:
  # setting it to false changes nothing, and a step's own scratch directory is the only
  # thing standing between it and this repo, the live database, or another step's
  # scratch files — not an enforced sandbox.
  node-fence-reads: true

logging:
  level:
    com.kanban: INFO
