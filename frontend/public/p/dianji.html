<style>
:root{
  --paper:#f6f1e6; --paper-2:#fbf7ef; --ink:#23201c; --ink-soft:#5d564c;
  --rule:#d8cdb8; --seal:#9c3d2e; --accent:#3f5a4e;
  --board-hi:#dcc9a3; --board-mid:#b99f74; --board-lo:#8e7549;
  --leaf-hi:#f2ead6; --leaf-lo:#ddd0ae;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#16150f; --paper-2:#1d1b14; --ink:#e6dfd0; --ink-soft:#a79d8c;
         --rule:#3a3528; --seal:#d97a63; --accent:#8fb3a1;
         --board-hi:#6b5a3d; --board-mid:#4e412c; --board-lo:#332a1c;
         --leaf-hi:#b9ac8c; --leaf-lo:#8b7f63; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong",
    "SimSun","Noto Serif CJK TC",serif;
  line-height:1.95; font-size:17px;
  text-rendering:optimizeLegibility;
}
a{color:var(--accent)}

/* ---------- masthead ---------- */
header.mast{
  border-bottom:1px solid var(--rule); background:var(--paper-2);
  padding:62px 24px 34px; text-align:center; position:relative; overflow:hidden;
}
header.mast::after{
  content:""; position:absolute; inset:auto 0 0 0; height:3px;
  background:linear-gradient(90deg,transparent,var(--seal),transparent); opacity:.5;
}
.mast h1{
  margin:0; font-size:clamp(38px,7vw,64px); letter-spacing:.32em;
  text-indent:.32em; font-weight:600; line-height:1.3;
}
.mast .cross{
  margin:22px 0 0; font-size:.78rem; letter-spacing:.16em; color:var(--ink-soft);
}
.mast .cross a{text-decoration:none; border-bottom:1px solid var(--rule); padding-bottom:2px}
.mast .cross a:hover{border-color:var(--seal); color:var(--seal)}

main{max-width:900px; margin:0 auto; padding:64px 26px 96px}

@media (max-width:640px){ main{padding:44px 20px 72px} }

/* ---------- the shelf: a library grid, several books to a row ---------- */
.shelf{
  display:grid;
  /* auto-fit + a fixed track, not auto-fill + 1fr: a row takes as many books as
     the width allows, but the tracks nobody stands in COLLAPSE. With two books
     on a wide screen that keeps the board under the books instead of running it
     out into empty space, and the shelf still fills left-to-right as volumes
     are added. */
  grid-template-columns:repeat(auto-fit,178px);
  justify-content:center;
  column-gap:40px; row-gap:56px;
  margin:0; padding:0; list-style:none;
}
.bay{min-width:0}

/* Books stand on a board. Every cover's bottom edge meets the board's top, so
   volumes of different proportions still share one shelf line. Each bay draws
   its own board and overhangs the 40px gutter by 20px on each side, so the
   boards of neighbouring books meet in the middle and read as one shelf —
   which works for any number of columns the grid happens to fit. */
.stand{
  --bh:228px;
  position:relative; display:flex; align-items:flex-end; justify-content:center;
  height:calc(var(--bh) + 26px); padding-bottom:11px;
}
.stand::after{
  content:""; position:absolute; left:-20px; right:-20px; bottom:0; height:11px;
  background:linear-gradient(180deg,var(--board-hi) 0 2px,var(--board-mid) 2px 62%,var(--board-lo));
  box-shadow:0 4px 9px rgba(60,45,20,.32), inset 0 1px 0 rgba(255,255,255,.22);
  border-radius:1px;
}
.vol{display:block; text-decoration:none; color:inherit}
.book{
  position:relative;
  height:var(--bh); width:calc(var(--bh) * var(--ar));
  transition:transform .28s cubic-bezier(.2,.7,.3,1);
}
/* A Chinese stitched book is sewn on the RIGHT (both covers carry the thread),
   so the loose leaf edges show on the LEFT. That's the block of pages. */
.book::before{
  content:""; position:absolute; left:-7px; top:4px; bottom:2px; width:8px;
  border-radius:3px 0 0 3px;
  background:repeating-linear-gradient(90deg,var(--leaf-hi) 0 1.5px,var(--leaf-lo) 1.5px 3px);
  box-shadow:inset -3px 0 4px rgba(60,45,20,.22), 0 12px 16px -12px rgba(60,45,20,.7);
}
.cover{
  position:absolute; inset:0; border-radius:2px;
  background-repeat:no-repeat;
  box-shadow:0 1px 1px rgba(60,45,20,.3), 0 22px 24px -16px rgba(60,45,20,.65);
}
/* light down the fore-edge, shadow into the sewn edge */
.cover::after{
  content:""; position:absolute; inset:0; border-radius:2px; pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.18) 0 2%,rgba(255,255,255,0) 12%,
    rgba(0,0,0,0) 91%,rgba(0,0,0,.15) 100%);
}
.vol:hover .book,.vol:focus-visible .book{transform:translateY(-11px)}
.vol:focus-visible{outline:none}
.vol:focus-visible .cover{outline:2px solid var(--seal); outline-offset:3px}

/* Both crops were measured off the scans themselves (column/row luminance),
   not eyeballed: the black photographic surround and, for the Sunzi, the blank
   right-hand page of the opening are cut away so only the leaf is left. */
.cover.sunzi{
  /* 1141x1024 opening -> left leaf x 20..570, y 20..1003 */
  background-size:207.5% 104.2%;
  background-position:3.4% 48.8%;
}
.cover.guiguzi{
  /* 655x1019 front cover -> x 0..644 (drops the black scan surround) */
  background-size:101.7% 100%;
  background-position:0% 0%;
}
.cover.sanshiliuji{
  /* 1941 瑞琴楼本封面。这张已按列/行亮度裁到封面本身（500x747 -> x 2..437,
     y 4..747），去掉了右侧的装裱衬纸和馆藏标签，所以整张铺满即可。 */
  background-size:100% 100%;
  background-position:0% 0%;
}
.cover.bingjian{
  /* 1925 上海昌文书局本封面。同样按列/行亮度裁过（500x746 -> x 0..430）：
     右边缘 x>=432 那一道是扫描留下的黑色书夹痕，裁掉后整张铺满即可。 */
  background-size:100% 100%;
  background-position:0% 0%;
}

/* ---------- the label under each book ---------- */
.plate{padding:18px 2px 0; text-align:center}
.plate h3{
  margin:0; font-size:1.12rem; font-weight:600; line-height:1.45;
  letter-spacing:.14em; text-indent:.14em;
}
.plate h3 a{color:inherit; text-decoration:none}
.plate h3 a:hover{color:var(--seal)}
.plate .imprint{
  margin:7px 0 0; font-size:.74rem; line-height:1.7;
  letter-spacing:.04em; color:var(--ink-soft);
}
.eds{margin:11px 0 0; display:flex; gap:4px; justify-content:center; flex-wrap:wrap}
.ed{
  display:inline-flex; align-items:center; font-size:.7rem; letter-spacing:.02em;
  color:var(--ink-soft); background:transparent; text-decoration:none;
  border:1px solid var(--rule); border-radius:999px; padding:3px 8px; transition:.15s;
}
.ed:hover{border-color:var(--seal); color:var(--seal)}
.ed.first{border-color:var(--seal); color:var(--seal)}

@media (max-width:640px){
  .shelf{grid-template-columns:repeat(auto-fit,156px); column-gap:22px; row-gap:44px}
  .stand{--bh:186px}
  .stand::after{left:-14px; right:-14px}
  .plate h3{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){
  .book{transition:none}
}
</style>
