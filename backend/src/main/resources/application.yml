spring:
  application:
    name: dashboard
  datasource:
    # File-based H2 so todos survive restarts. Delete ./data/dashboard.mv.db to reset.
    url: jdbc:h2:file:./data/dashboard;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# --- Claude Code worker ---
worker:
  enabled: true
  # Path to the Claude Code CLI. Use an absolute path if it isn't on the service PATH.
  claude-command: claude
  # Args before the prompt. stream-json (+ --verbose) makes the session emit events as
  # they happen, which feed the live per-todo log. To let the session edit files / run
  # commands unattended, add "--dangerously-skip-permissions" (only in a trusted sandbox).
  extra-args:
    - "--output-format"
    - "stream-json"
    - "--verbose"
  # The directory each Claude session runs in — point this at a repo or sandbox.
  working-directory: ${user.home}/dashboard-work
  # Per-task hard timeout. Autonomous/agentic tasks (research, multi-file edits,
  # anything that browses or runs many tools) can take tens of minutes — 30 min
  # is a safer default than a few minutes. Raise it for very long jobs.
  timeout-seconds: 1800
  batch-size: 1
  poll-interval-ms: 15000
  initial-delay-ms: 10000

logging:
  level:
    com.dashboard: INFO
