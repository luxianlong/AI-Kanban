spring:
  application:
    name: kanban
  lifecycle:
    # Upper bound on graceful shutdown. Must stay comfortably BELOW the kill grace in
    # scripts/env.sh (BACKEND_KILL_GRACE, 60s) so the JVM always wins the race and the
    # script never has to resort to SIGKILL.
    timeout-per-shutdown-phase: 45s
  task:
    scheduling:
      pool:
        # One thread per @Scheduled poller. There are exactly two — the board's task
        # worker (ClaudeWorkerService.poll) and the workflow runner
        # (WorkflowRunnerService.poll) — and Boot's default pool size of 1 put both on
        # the same thread. Because a tick blocks inside Process.waitFor for the whole
        # Claude session (up to worker.timeout-seconds), whichever poller went first
        # locked the other out for the entire run: a 9-minute board task froze every
        # workflow for 9 minutes, and vice versa. Measured on this box, 42% of workflow
        # wall-clock was spent waiting for the thread (62% on the worst run) — see
        # docs/workflow-parallel-workers.md for the numbers.
        #
        # This raises nobody's concurrency on its own: the board still takes
        # worker.batch-size (1) task per tick, and the runner still advances one node at
        # a time per run. It only stops the two pollers from queueing behind each other.
        # How many workflow runs go at once is workflow.max-concurrent-executions below;
        # a Claude session is ~270 MB, so keep an eye on free memory.
        size: 2
  datasource:
    # File-based H2 so todos survive restarts.
    #
    # The path MUST be absolute. A relative path like ./data/kanban resolves
    # against the process working directory, which differs by launcher:
    #   - `java -jar` from the repo root  -> <repo>/data/kanban.mv.db
    #   - `mvnw spring-boot:run` from backend/ -> <repo>/backend/data/kanban.mv.db
    # That mismatch made the app silently open two different DB files depending
    # on how it was started, so the board appeared to "revert" after a restart
    # (bug: "my db is not correct again"). KANBAN_DATA_DIR (exported absolute by
    # scripts/env.sh) pins the location; the fallback is absolute too so an
    # ad-hoc launch from any directory still finds the same file.
    # To reset, delete <KANBAN_DATA_DIR>/kanban.mv.db.
    url: jdbc:h2:file:${KANBAN_DATA_DIR:${user.home}/Dashboard/data}/kanban;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      # Task attachments are images; keep the request cap in step with
      # attachments.max-bytes below (a little headroom for the multipart frame).
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  # Graceful shutdown: on SIGTERM, stop accepting new requests and let in-flight
  # ones finish instead of dropping the JVM mid-write. Paired with the worker's
  # @PreDestroy session abort and the 60s kill grace in scripts/env.sh, this keeps
  # restarts on the clean-shutdown path. It matters more than it looks: H2 compacts
  # and TRUNCATES kanban.mv.db during its shutdown, so a SIGKILL landing in that
  # window leaves a file whose newest chunks were never flushed — unrecoverable,
  # by any rollback point (that is exactly how the DB was lost on 2026-08-29).
  shutdown: graceful

# --- Task attachments (images a user adds as input for the agent) ---
# Files live next to the live H2 database so one data directory holds all user
# state; only their metadata is stored in the database. The worker hands the
# agent the absolute path of each file, so the session can open the image.
attachments:
  dir: ${KANBAN_DATA_DIR:${user.home}/Dashboard/data}/attachments
  max-bytes: 10485760

# --- Public static-page uploads (task #470) ---
# POST /api/pages accepts a self-contained HTML file WITHOUT any credential and
# publishes it at /p/<slug>.html. Nobody signs in, so these caps are the only
# abuse control: keep them conservative. Set max-uploads-per-hour to 0 to turn
# publishing off entirely (the GET endpoints keep working).
pages:
  max-bytes: 5242880
  max-pages: 200
  max-uploads-per-hour: 30

# --- Claude Code worker ---
worker:
  enabled: true
  # Path to the Claude Code CLI. Use an absolute path if it isn't on the service PATH.
  claude-command: claude
  # Args before the prompt. stream-json (+ --verbose) makes the session emit events as
  # they happen, which feed the live per-todo log. To let the session edit files / run
  # commands unattended, add "--dangerously-skip-permissions" (only in a trusted sandbox).
  extra-args:
    - "--output-format"
    - "stream-json"
    - "--verbose"
  # The directory each Claude session runs in — point this at a repo or sandbox.
  working-directory: ${user.home}/kanban-work
  # Per-task hard timeout. Autonomous/agentic tasks (research, multi-file edits,
  # anything that browses or runs many tools) can take tens of minutes — 30 min
  # is a safer default than a few minutes. Raise it for very long jobs.
  timeout-seconds: 1800
  batch-size: 1
  poll-interval-ms: 15000
  initial-delay-ms: 10000

# --- Workflow runner (a DAG of prompt tasks) ---
# The tick dispatches rather than runs: each eligible execution gets a lane of the
# runner's own pool and the scheduler thread returns immediately, so a nine-minute node
# no longer blocks anything. This and the worker above also get a scheduler thread each
# (spring.task.scheduling.pool.size above), so neither waits on the other. A node
# inherits worker.timeout-seconds; it runs in a per-run scratch directory under
# java.io.tmpdir, not worker.working-directory.
workflow:
  poll-interval-ms: 5000
  initial-delay-ms: 12000
  # How many runs may have a node in flight at once — this is what lets two executions
  # of the same workflow, or of different workflows, progress at the same time instead
  # of queueing behind each other.
  #
  # It is a cap on RUNS, not on nodes: one execution still occupies exactly one lane and
  # advances one node at a time, even where its graph has independent branches. That is
  # deliberate — it is what makes "exactly one thread touches a run's rows" true, so no
  # two lanes can claim the same node and pay for the same session twice.
  #
  # The ceiling is memory, not CPU: a Claude session is ~270 MB, and peak processes on
  # this machine is this number + one board task + AiStoryClassifier's pool (2). Check
  # `free -m` before raising it; 1 restores the old strictly-serial behaviour.
  max-concurrent-executions: 2
  # --- How the ENTRY step is run (the first node; every other node is unaffected) ---
  # The entry step is the only one with no upstream text: it goes and finds the material
  # the whole graph then works on, and every step below it inherits whatever it got
  # wrong. So it is worth more effort there than anywhere else.
  #
  # ultracode = xhigh effort plus dynamic-workflow orchestration, passed to the CLI as
  # --settings '{"ultracode":true}' (merged into the normal settings, so MCP servers and
  # permissions are unchanged). Its sub-agents are in-process, so this costs tokens and
  # wall-clock, not another ~270 MB process. Set to false to run the entry step like any
  # other node.
  entry-node-ultracode: true
  # Prepends one line to the entry step's prompt asking it to read the web through the
  # chrome-devtools MCP browser instead of WebSearch/WebFetch — a rendered page rather
  # than a stripped copy of one. Needs the chrome-devtools MCP server to be configured
  # for the CLI; without it the node simply falls back to the tools it does have.
  entry-node-prefer-browser: true

logging:
  level:
    com.kanban: INFO
